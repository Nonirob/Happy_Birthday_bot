<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Birthday Quest for My Wife</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      background-size: 400% 400%;
      animation: skyShift 15s ease infinite;
      color: #ffffff;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes skyShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      pointer-events: none;
      animation: floatCloud linear infinite;
    }
    @keyframes floatCloud {
      from { transform: translateX(-150px); }
      to { transform: translateX(calc(100vw + 150px)); }
    }

    .sky-tracker {
      width: 100%;
      max-width: 400px;
      height: 90px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .sky-path {
      position: absolute;
      bottom: 15px;
      left: 20px;
      right: 20px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    .mascot-container {
      position: absolute;
      left: 10px;
      bottom: 18px;
      font-size: 36px;
      transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }

    .mascot-container.fly {
      animation: flyUp 0.6s ease;
    }

    @keyframes flyUp {
      0% { transform: scale(1); }
      50% { transform: scale(1.3) translateY(-15px) rotate(-10deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }

    .sky-gift {
      position: absolute;
      right: 20px;
      bottom: 18px;
      font-size: 32px;
      animation: pulseGift 1.5s ease-in-out infinite;
    }
    @keyframes pulseGift {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .game-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
      gap: 12px;
    }

    .glass-card {
      background: rgba(20, 30, 45, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .prompt-text {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    .target-ru {
      font-size: 17px;
      font-weight: 700;
      color: #70f3ff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .answer-line {
      min-height: 60px;
      background: rgba(10, 15, 25, 0.5);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      align-items: center;
    }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }

    .btn-word {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-bottom: 3px solid rgba(0, 0, 0, 0.4);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn-word .word-main {
      font-size: 15px;
      font-weight: 700;
    }

    .btn-word .word-hint {
      font-size: 10px;
      color: #fbbf24;
      margin-top: 1px;
      font-weight: 500;
    }

    .btn-word:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .btn-word.used {
      opacity: 0.15;
      pointer-events: none;
      transform: scale(0.95);
    }

    .success-banner {
      position: fixed;
      bottom: -100px;
      left: 0;
      right: 0;
      background: #d7ffb8;
      color: #2b7000;
      padding: 15px 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
      transition: bottom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
    }
    .success-banner.show {
      bottom: 0;
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #58cc02, #419600);
      border: none;
      border-bottom: 4px solid #2e6a00;
      color: white;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 4px 15px rgba(88, 204, 2, 0.4);
      transition: all 0.1s ease;
      margin-top: 5px;
    }

    .action-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .final-card {
      display: none;
      text-align: center;
      background: rgba(20, 30, 45, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 25px 20px;
      max-width: 400px;
      width: 100%;
      border: 2px solid #58cc02;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .final-card h1 { color: #58cc02; margin-top: 0; font-size: 26px; }
  </style>
</head>
<body>

  <div class="cloud" style="width: 80px; height: 30px; top: 10%; animation-duration: 22s; animation-delay: -5s;"></div>
  <div class="cloud" style="width: 120px; height: 45px; top: 35%; animation-duration: 35s; animation-delay: -2s;"></div>
  <div class="cloud" style="width: 60px; height: 22px; top: 70%; animation-duration: 18s; animation-delay: -10s;"></div>

  <div class="sky-tracker" id="tracker">
    <div class="sky-path"></div>
    <div class="sky-gift" title="Вершина">❤️☁️</div>
    <div class="mascot-container" id="mascot">🦉</div>
  </div>

  <div class="game-wrapper" id="game-container">
    <div class="glass-card">
      <div class="prompt-text">Переведи фразу:</div>
      <div class="target-ru" id="ru-text"></div>
    </div>

    <div class="answer-line" id="answer-line"></div>

    <div class="word-pool" id="word-pool"></div>

    <button class="action-btn" onclick="checkAnswer()">Проверить 🚀</button>
  </div>

  <!-- Финал с вашим текстом -->
  <div class="final-card" id="final-card">
    <div style="font-size: 60px; margin-bottom: 10px;">💖✨🥰</div>
    <h1>С Днём Рождения!</h1>
    <p style="font-size: 17px; line-height: 1.6; color: #cbd5e1;">
      Ты успешно прошла весь праздничный урок! ❤️<br><br>
      <b>Я тебя так сильно люблю, моя ненаглядная! Благодарю Бога за такую жену, как ты, ведь лучше нету на свете!</b>
    </p>
  </div>

  <div class="success-banner" id="success-banner">
    <div>✨ <b>Отлично!</b> Урок пройден верно!</div>
    <div style="font-size: 22px;">🎉</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const levels = [
      {
        ru: "Ты самая красивая женщина в мире",
        wordsMap: [
          { en: "You", ru: "Ты" },
          { en: "are", ru: "—" },
          { en: "the", ru: "самая" },
          { en: "most", ru: "более" },
          { en: "beautiful", ru: "красивая" },
          { en: "woman", ru: "женщина" },
          { en: "in", ru: "в" },
          { en: "the", ru: "мире" },
          { en: "world", ru: "мире" },
          { en: "cat", ru: "кот" },
          { en: "always", ru: "всегда" },
          { en: "nice", ru: "милый" }
        ],
        target: ["You", "are", "the", "most", "beautiful", "woman", "in", "the", "world"]
      },
      {
        ru: "Каждый день с тобой — прекрасное благословение",
        wordsMap: [
          { en: "Every", ru: "Каждый" },
          { en: "day", ru: "день" },
          { en: "with", ru: "с" },
          { en: "you", ru: "тобой" },
          { en: "is", ru: "—" },
          { en: "a", ru: "прекрасное" },
          { en: "wonderful", ru: "чудесный" },
          { en: "blessing", ru: "благословение" },
          { en: "happy", ru: "счастливый" },
          { en: "sun", ru: "солнце" },
          { en: "big", ru: "большой" }
        ],
        target: ["Every", "day", "with", "you", "is", "a", "wonderful", "blessing"]
      },
      {
        ru: "С днем рождения мою невероятную жену",
        wordsMap: [
          { en: "Happy", ru: "Счастливого" },
          { en: "Birthday", ru: "Дня рождения" },
          { en: "to", ru: "моей" },
          { en: "my", ru: "моей" },
          { en: "incredible", ru: "невероятной" },
          { en: "wife", ru: "жене" },
          { en: "love", ru: "любовь" },
          { en: "best", ru: "лучший" },
          { en: "star", ru: "звезда" }
        ],
        target: ["Happy", "Birthday", "to", "my", "incredible", "wife"]
      }
    ];

    let currentLevel = 0;
    let selectedWords = [];

    function initLevel() {
      const level = levels[currentLevel];
      document.getElementById('ru-text').innerText = `«${level.ru}»`;
      document.getElementById('answer-line').innerHTML = '';
      selectedWords = [];

      updateMascotPosition();

      const shuffledWords = [...level.wordsMap].sort(() => Math.random() - 0.5);
      
      const pool = document.getElementById('word-pool');
      pool.innerHTML = '';
      shuffledWords.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn-word';
        btn.id = `word-${index}`;
        
        btn.innerHTML = `
          <span class="word-main">${item.en}</span>
          <span class="word-hint">${item.ru}</span>
        `;
        
        btn.onclick = () => selectWord(item.en, item.ru, index);
        pool.appendChild(btn);
      });
    }

    function updateMascotPosition() {
      const mascot = document.getElementById('mascot');
      const trackerWidth = document.getElementById('tracker').clientWidth - 65;
      const progress = currentLevel / levels.length;
      const newLeft = 12 + (trackerWidth - 35) * progress;
      mascot.style.left = `${newLeft}px`;
    }

    function selectWord(word, hintText, index) {
      const btn = document.getElementById(`word-${index}`);
      btn.classList.add('used');

      const ansBtn = document.createElement('button');
      ansBtn.className = 'btn-word';
      ansBtn.innerHTML = `
        <span class="word-main">${word}</span>
        <span class="word-hint">${hintText}</span>
      `;
      ansBtn.onclick = () => deselectWord(ansBtn, btn, word);

      document.getElementById('answer-line').appendChild(ansBtn);
      selectedWords.push(word);
    }

    function deselectWord(ansBtn, originalBtn, word) {
      ansBtn.remove();
      originalBtn.classList.remove('used');
      const idx = selectedWords.indexOf(word);
      if (idx > -1) selectedWords.splice(idx, 1);
    }

    function checkAnswer() {
      const currentTarget = levels[currentLevel].target;
      const mascot = document.getElementById('mascot');
      
      if (JSON.stringify(selectedWords) === JSON.stringify(currentTarget)) {
        mascot.classList.add('fly');
        setTimeout(() => mascot.classList.remove('fly'), 600);

        confetti({
          particleCount: 80,
          spread: 90,
          origin: { y: 0.6 },
          colors: ['#58cc02', '#ffd900', '#ff4b4b', '#1cb0f6']
        });

        const banner = document.getElementById('success-banner');
        banner.classList.add('show');
        tg.HapticFeedback.notificationOccurred('success');
        
        currentLevel++;
        
        setTimeout(() => {
          banner.classList.remove('show');
        }, 1500);

        if (currentLevel < levels.length) {
          setTimeout(() => {
            initLevel();
          }, 1200);
        } else {
          const trackerWidth = document.getElementById('tracker').clientWidth - 55;
          mascot.style.left = `${trackerWidth}px`;
          showFinalScreen();
        }
      } else {
        mascot.innerText = '😢';
        tg.HapticFeedback.notificationOccurred('error');
        
        const answerLine = document.getElementById('answer-line');
        answerLine.style.transform = 'translateX(8px)';
        setTimeout(() => answerLine.style.transform = 'translateX(-8px)', 100);
        setTimeout(() => answerLine.style.transform = 'translateX(0)', 200);

        setTimeout(() => {
          mascot.innerText = '🦉';
        }, 1000);
      }
    }

    function showFinalScreen() {
      setTimeout(() => {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('tracker').style.display = 'none';
        document.getElementById('final-card').style.display = 'block';
        
        var duration = 2.5 * 1000;
        var end = Date.now() + duration;
        (function frame() {
          confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
          });
          confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
          });
          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        }());
      }, 800);
    }

    initLevel();
  </script>
</body>
</html>
