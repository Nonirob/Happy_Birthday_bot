<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Для Оксаны 💖</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a2a3a; --rose:#e0457b; --cream:#fff8f3;
  --top:max(env(safe-area-inset-top,0px), calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f2e;color:#fff;
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #ffd36e;outline-offset:2px}

#hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(var(--top) + 8px) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .4s,transform .4s}
#hud.show{opacity:1;transform:none}
.hrow{display:flex;gap:6px;align-items:center}
.chip{background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:5px 11px;font-weight:900;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
.chip.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25)}}
#chapterChip{overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
#muteBtn{pointer-events:auto;border:none;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:0}
#words{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}
.wchip{background:linear-gradient(180deg,#ff8db5,#ff5c92);color:#fff;font-weight:900;font-size:12px;padding:3px 9px;border-radius:999px;box-shadow:0 3px 10px rgba(255,80,140,.45);animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

#bubble{position:fixed;left:10px;bottom:calc(var(--bot) + 84px);z-index:12;max-width:min(300px,calc(100% - 20px));padding-left:44px!important;background:#fff;color:var(--ink);font-weight:800;font-size:14px;line-height:1.3;padding:9px 12px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;opacity:0;transform-origin:20px 50%;transform:translateY(10px) scale(.6);transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
#bubble.show{opacity:1;transform:none}
#bubble::before{content:'🐱';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:24px}
#bubble b{color:var(--rose)}

#tapHint{position:fixed;left:50%;bottom:calc(var(--bot) + 26px);transform:translateX(-50%);z-index:11;background:rgba(30,10,50,.45);padding:9px 18px;border-radius:999px;font-weight:800;font-size:15px;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
#tapHint.show{opacity:1;animation:hint 1.2s ease-in-out infinite}
@keyframes hint{50%{transform:translateX(-50%) translateY(-6px)}}

#toast{position:fixed;left:50%;top:calc(var(--top) + 86px);transform:translate(-50%,-16px);z-index:20;background:rgba(255,255,255,.96);color:var(--ink);font-weight:800;font-size:15px;line-height:1.35;padding:12px 16px;border-radius:18px;width:max-content;max-width:88%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .45s,transform .45s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(25,10,45,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.show{opacity:1;pointer-events:auto}
.card{position:relative;background:var(--cream);color:var(--ink);border-radius:26px;padding:22px 18px 18px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4);transform:scale(.85) translateY(24px);transition:transform .5s cubic-bezier(.3,1.5,.5,1);text-align:center}
.overlay.show .card{transform:none}
.card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(var(--bot) + 46px);pointer-events:none;transition:opacity .6s;text-align:center}
#title.hide{opacity:0}
#title .sub{font-family:'Caveat',cursive;font-size:34px;font-weight:700;line-height:1.05;text-shadow:0 2px 14px rgba(255,120,180,.8);margin-bottom:8px;opacity:0;animation:fadeUp 1s 2.4s forwards}
#title .sub2{font-size:14px;color:#d9d3ff;margin-bottom:24px;opacity:0;animation:fadeUp 1s 3s forwards}
.bigBtn{pointer-events:auto;border:none;background:linear-gradient(180deg,#ff8bb3,#ff4f88);color:#fff;font-weight:900;font-size:18px;padding:15px 34px;border-radius:999px;box-shadow:0 7px 0 #c7336a,0 14px 30px rgba(255,80,140,.5);transition:transform .1s,box-shadow .1s}
.bigBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #c7336a,0 8px 20px rgba(255,80,140,.4)}
#startBtn{opacity:0;animation:fadeUp .8s 3.5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

#chapter{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;padding:0 20px}
#chapter.show{opacity:1;pointer-events:auto}
#chapter .ce{font-size:66px;animation:floaty 2s ease-in-out infinite}
#chapter .cn{margin-top:12px;font-size:17px;color:#ffb3cf;font-weight:900}
#chapter .ct{font-family:'Caveat',cursive;font-size:46px;font-weight:700;line-height:1.05;margin-top:2px}
#chapter .cs{margin-top:22px;font-size:13px;color:#b9b2e6}
@keyframes floaty{50%{transform:translateY(-8px)}}

.memE{font-size:58px;margin-top:-64px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.memTitle{font-weight:900;color:var(--rose);font-size:15px;margin:8px 0 6px}
.memText{font-family:'Caveat',cursive;font-size:28px;line-height:1.12;font-weight:700}
.memTap{margin-top:14px;font-size:12px;color:#a58b98}

.pzHead{font-weight:900;font-size:17px;color:var(--rose)}
.pzSub{font-size:13px;color:#a58b98;margin-top:2px}
.pzRu{font-family:'Caveat',cursive;font-size:29px;font-weight:700;line-height:1.08;margin:6px 0 12px}
#pzAnswer{min-height:60px;border:2px dashed #e9c7d5;background:#fff;border-radius:16px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;margin-bottom:12px;transition:border-color .3s,background .3s}
#pzAnswer.win{border-color:#55c27a;border-style:solid;background:#effbf2}
#pzPool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:50px}
.tile{border:none;background:#fff;color:var(--ink);border-radius:12px;padding:6px 10px 5px;box-shadow:0 3px 0 #e2c9d4,0 4px 10px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;min-width:44px;transition:transform .12s}
.tile:active{transform:translateY(2px)}
.tile .en{font-weight:900;font-size:16px}
.tile .ru{font-size:10px;color:#b07f95;font-weight:700;margin-top:1px}
.tile.found{background:linear-gradient(180deg,#fff6d2,#ffe08a);box-shadow:0 3px 0 #e8b93f,0 4px 12px rgba(255,190,60,.35)}
.tile.used{opacity:0;pointer-events:none}
.tile.glow{animation:glow .6s ease-in-out 4}
@keyframes glow{50%{transform:scale(1.15);box-shadow:0 0 0 4px #ff8db5}}
.pzLegend{font-size:11px;color:#a58b98;margin-top:10px}
#pzMsg{min-height:22px;margin-top:8px;font-weight:800;font-size:14px;color:#c0507e}
#pzMsg b{color:#2f9a55}
.pzBtns{display:flex;gap:8px;justify-content:center;margin-top:6px}
.smallBtn{border:none;background:#f3e6ec;color:var(--ink);font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px}

#letter{align-items:flex-start;overflow-y:auto;touch-action:pan-y;padding-top:calc(var(--top) + 18px);padding-bottom:calc(var(--bot) + 30px)}
#letter .card{text-align:left;background:linear-gradient(#fffaf5,#fff0ea);margin:auto 0}
.lHead{text-align:center;font-weight:900;color:var(--rose);font-size:16px}
#lText{font-family:'Caveat',cursive;font-size:25px;line-height:1.2;font-weight:600;min-height:220px;margin-top:10px}
#lText p{margin:0 0 10px}
.caret{display:inline-block;width:2px;height:21px;background:var(--rose);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sign{text-align:right;font-family:'Caveat',cursive;font-size:32px;font-weight:700;color:var(--rose);opacity:0;transition:opacity .8s}
.polaroid{display:none;margin:14px auto 4px;width:84%;background:#fff;padding:10px 10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:rotate(-3deg)}
.polaroid.show{display:block;animation:polIn 1s cubic-bezier(.3,1.4,.5,1)}
@keyframes polIn{from{opacity:0;transform:rotate(-12deg) scale(.5)}to{opacity:1;transform:rotate(-3deg) scale(1)}}
.polaroid img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.polaroid div{font-family:'Caveat',cursive;font-size:25px;font-weight:700;text-align:center;margin-top:6px;color:var(--ink)}
.lBtns{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:18px}
.lBtns.show{display:flex;animation:fadeUp .7s}
#surpriseMsg{font-weight:800;color:var(--rose);text-align:center;min-height:20px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hrow">
    <div class="chip" id="chapterChip">⛪ Глава 1</div>
    <div class="spacer"></div>
    <div class="chip" id="heartChip">💗 0/7</div>
    <div class="chip" id="roseChip">🌹 0/33</div>
    <button id="muteBtn" aria-label="Звук">🔊</button>
  </div>
  <div id="words"></div>
</div>
<div id="bubble"></div>
<div id="tapHint">👆 Тапни — прыжок</div>
<div id="toast"></div>

<div id="title">
  <div class="sub">С днём рождения, Масянька!</div>
  <div class="sub2">Маленькое приключение, сделанное с любовью</div>
  <button class="bigBtn" id="startBtn">Начать ▶</button>
</div>

<div id="chapter"><div class="ce" id="chE"></div><div class="cn" id="chN"></div><div class="ct" id="chT"></div><div class="cs">тапни, чтобы начать</div></div>

<div class="overlay" id="memory"><div class="card" style="padding-top:46px">
  <div class="memE" id="memE"></div>
  <div class="memTitle">Помнишь?</div>
  <div class="memText" id="memText"></div>
  <div class="memTap">тапни, чтобы бежать дальше 💕</div>
</div></div>

<div class="overlay" id="puzzle"><div class="card" id="pzCard">
  <div class="pzHead">🔒 Ворота на замке</div>
  <div class="pzSub">Собери эту фразу по-английски:</div>
  <div class="pzRu" id="pzRu"></div>
  <div id="pzAnswer"></div>
  <div id="pzPool"></div>
  <div class="pzLegend">✨ золотые — слова из твоих сердечек</div>
  <div id="pzMsg"></div>
  <div class="pzBtns"><button class="smallBtn" id="pzHint">💡 Подсказка</button><button class="smallBtn" id="pzClear">↺ Заново</button></div>
</div></div>

<div class="overlay" id="letter"><div class="card" id="letterCard">
  <div class="lHead">💌 Письмо для тебя</div>
  <div id="lText"></div>
  <div class="sign" id="lSign"></div>
  <div class="polaroid" id="polaroid"><img id="photo" alt="Мы вдвоём"><div>Ты, я… и скоро нас трое ❤️</div></div>
  <div class="lBtns" id="lBtns">
    <button class="bigBtn" id="surpriseBtn">💌 Ещё один сюрприз</button>
    <div id="surpriseMsg"></div>
    <button class="smallBtn" id="replayBtn">↻ Пройти ещё раз</button>
  </div>
</div></div>

const MEL = [72,null,76,79, 76,null,74,72, 71,null,74,79, 74,null,72,71, 69,null,72,76, 74,72,71,69, 72,74,76,null, 77,76,74,null];
const MELBOX = [76,null,null,79,null,null,77,76, 74,null,null,79,null,null,77,74, 72,null,null,76,null,null,74,72, 77,null,76,null,74,null,72,null];
const AU = {
  ctx:null, muted:false, mode:'game', step:0, next:0,
  start(){
    if (this.ctx){ this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = .8; this.master.connect(c.destination);
    this.mus = c.createGain(); this.mus.gain.value = .3; this.mus.connect(this.master);
    this.fx = c.createGain(); this.fx.gain.value = .55; this.fx.connect(this.master);
    const nb = this.nb = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = nb.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    this.next = c.currentTime + .15;
    setInterval(()=>this.tick(), 30);
  },
  tone(f,t,d,type='sine',g=.2,dest=this.fx,att=.006){
    const c=this.ctx, o=c.createOscillator(), a=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    a.gain.setValueAtTime(0,t); a.gain.linearRampToValueAtTime(g,t+att); a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(a); a.connect(dest); o.start(t); o.stop(t+d+.05);
  },
  sweep(f1,f2,d,type,g,dt=0){
    const c=this.ctx, t=c.currentTime+dt, o=c.createOscillator(), a=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
    a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(a); a.connect(this.fx); o.start(t); o.stop(t+d+.05);
  },
  noise(d,g,freq,type='bandpass',dt=0,dest=this.fx){
    const c=this.ctx, t=c.currentTime+dt, s=c.createBufferSource(), f=c.createBiquadFilter(), a=c.createGain();
    s.buffer=this.nb; f.type=type; f.frequency.value=freq;
    a.gain.setValueAtTime(g,t); a.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f); f.connect(a); a.connect(dest); s.start(t, Math.random()*.5); s.stop(t+d+.05);
  },
  tick(){
    const c=this.ctx; if(!c) return;
    const spb = this.mode==='box' ? 60/84/2 : 60/116/2;
    if (this.next < c.currentTime) this.next = c.currentTime + .05;
    while (this.next < c.currentTime + .2){ this.playStep(this.step, this.next, spb); this.step=(this.step+1)%32; this.next += spb; }
  },
  playStep(i,t,spb){
    const bar = Math.floor(i/8), root=[48,43,45,41][bar];
    const ch = [[60,64,67],[55,59,62],[57,60,64],[53,57,60]][bar];
    if (this.mode==='game'){
      const m = MEL[i]; if (m) this.tone(mtof(m), t, spb*.9, 'square', .045, this.mus);
      if (i%2===0) this.tone(mtof(root), t, spb*1.8, 'triangle', .16, this.mus);
      if (i%2===1) this.tone(mtof(ch[(i>>1)%3]+12), t, spb*.7, 'sine', .04, this.mus);
    } else {
      const m = MELBOX[i]; if (m) this.tone(mtof(m+12), t, 1.4, 'sine', .11, this.mus);
      this.tone(mtof(ch[i%3]+12), t, .9, 'triangle', .045, this.mus);
      if (i%8===0) this.tone(mtof(root), t, 2.4, 'sine', .14, this.mus);
    }
  },
  setMode(m){ this.mode=m; this.step=0; },
  toggle(){ this.muted=!this.muted; if(this.master) this.master.gain.value = this.muted?0:.8; return this.muted; },
  sfx(n){
    const c=this.ctx; if(!c||this.muted) return; const t=c.currentTime;
    const T=(f,d,ty,g,dt=0)=>this.tone(f,t+dt,d,ty,g);
    switch(n){
      case 'jump': this.sweep(380,820,.15,'triangle',.18); break;

const PLAT = { church:'cloud', beach:'boat', pizza:'awning', home:'wood', final:'wood' };
const DECOR = {
  church:{step:38, kinds:r=>r<.78?'flower':'bush'},
  beach:{step:70, kinds:r=>r<.45?'shell':r<.8?'starfish':'umbrella'},
  pizza:{step:110, kinds:r=>r<.35?'lamp':r<.6?'table':'planter'},
  home:{step:60, kinds:r=>r<.35?'fence':r<.65?'bush':'flower'},
  final:{step:85, kinds:r=>r<.35?'lantern':'rosebush'}
};
function build(sp){
  const L = { sp, theme:sp.theme, len:sp.len, gateX:sp.len, final:!!sp.final, ivanX:sp.ivanX||0, gateOpen:false, gateT:0 };
  L.segs=[]; let x=-700;
  for (const [gx,gw] of sp.gaps){ L.segs.push([x,gx]); x=gx+gw; }
  L.segs.push([x, sp.len+1000]);
  L.plats = sp.plats.map(([px,py,w,st])=>({x:px,y:py,w,style:st||PLAT[sp.theme]}));
  L.springs = sp.springs.map(sx=>({x:sx,sq:0}));
  L.items = [];
  sp.hearts.forEach(([hx,hy,w])=>L.items.push({type:'heart',x:hx,y:hy,word:w,ph:R(hx)*6}));
  sp.roses.forEach(([rx,ry])=>L.items.push({type:'rose',x:rx,y:ry}));
  sp.mems.forEach(([mx,text,emoji])=>L.items.push({type:'mem',x:mx,y:-36,text,emoji}));
  L.decor=[]; const D=DECOR[sp.theme];
  for (const [a,b] of L.segs){
    let dx=Math.max(a+30,-400), k=0;
    while (dx < Math.min(b-30, sp.len+800)){
      const r=R(dx*.37+k*3.1);
      const near = Math.abs(dx-L.gateX)<90 || (L.final && Math.abs(dx-L.ivanX)<70) || L.springs.some(s=>Math.abs(s.x-dx)<30);
      if (!near) L.decor.push({x:dx, r, kind:D.kinds(r)});
      dx += D.step*(.6+R(dx+7)*.9); k++;
    }
  }
  return L;
}

function updParts(arr,dt){
  for (let i=arr.length-1;i>=0;i--){ const p=arr[i];
    if (p.type==='rocket'){ p.t+=dt; const k=Math.min(1,p.t/p.dur); p.y=lerp(p.y0,p.ty,1-Math.pow(1-k,2)); p.x+=Math.sin(p.t*20)*.2;

    p.life-=dt; if (p.life<=0){ arr.splice(i,1); continue; }

function drawPart(p,ox,oy){

function doJump(first){

}
function tapJump(){
  if (state!=='play' || P.stop || P.rescue) return;

  else if (P.jumps<2) doJump(false);

}
function land(){ if (P.vy>320){ P.sq=Math.min(.9,P.vy/1000); dust(P.x,P.y); } P.vy=0; P.ground=true; P.jumps=0; P.coy=0; if (P.buf>0) doJump(true); }
function startRescue(){
  let nx=null; for (const s of L.segs) if (s[0]>P.x-10){ nx=s[0]; break; }
  if (nx===null) nx=P.x+100;
  P.rescue={t:0,x0:P.x,y0:P.y,x1:nx+40,y1:-12}; P.vy=0; AU.sfx('cloud'); haptic('warning');
  if (!flags.rescue){ flags.rescue=1; say('Ой! Не страшно — облачко всегда тебя поймает ☁️💕',3.4); }
}
function updatePlayer(dt){
  P.t+=dt;
  if (P.rescue){
    const r=P.rescue; r.t+=dt; const k=Math.min(1,r.t/1.3), e=ease(k);
    P.x=lerp(r.x0,r.x1,e); P.y=lerp(r.y0,r.y1,e)-Math.sin(k*Math.PI)*50;
    if (k>=1){ P.rescue=null; P.vy=0; P.ground=false; P.jumps=1; }
    return;
  }
  const moving = !P.stop || P.walk;
  if (!P.stop) P.x += SPEED*dt;
  const py=P.y; P.vy+=G*dt; P.y+=P.vy*dt;
  const was=P.ground; P.ground=false;
  if (P.vy>=0){
    if (onGround(P.x) && py<=.5 && P.y>=0){ P.y=0; land(); }
    else for (const p of L.plats){ if (P.x>p.x-6 && P.x<p.x+p.w+6 && py<=p.y+.5 && P.y>=p.y){ P.y=p.y; land(); break; } }
  }
  if (!P.ground){ P.coy += was?0:dt; } 
  if (P.buf>0) P.buf-=dt;
  for (const s of L.springs){
    if (P.ground && Math.abs(P.x-s.x)<18 && Math.abs(P.y)<2){ P.vy=-920; P.ground=false; P.jumps=1; s.sq=1; AU.sfx('spring'); haptic('medium');
      for (let i=0;i<10;i++) spawn(parts,{x:s.x+(Math.random()-.5)*20,y:-14,vx:(Math.random()-.5)*120,vy:-80-Math.random()*120,g:300,life:.7,max:.7,size:3,col:'#ff9cc0',type:'heart'});
      if (!flags.spring){ flags.spring=1; say('Вжух! Цветочек подбрасывает высоко 🌸',3); } }
  }
  if (P.y>150) startRescue();
  P.sq *= Math.pow(.002,dt);
  if (moving && P.ground){ P.trail-=dt; if (P.trail<=0){ P.trail=.09; spawn(parts,{x:P.x-6,y:P.y-6,vx:-20,vy:-20,life:.6,max:.6,size:2,col:'rgba(255,200,225,.9)',type:'spark'}); } }
}
function updateMia(dt){
  hist.push({x:P.x,y:P.y,t:clock});
  while (hist.length>2 && hist[0].t<clock-.7) hist.shift();
  let h=hist[0]; for (let i=hist.length-1;i>=0;i--){ if (hist[i].t<=clock-.25){ h=hist[i]; break; } }
  const tx = (state==='finale' ? P.x-46 : h.x-38);
  mia.moving = Math.abs(tx-mia.x)>.4;
  mia.x = state==='finale' ? lerp(mia.x,tx,Math.min(1,dt*3)) : tx;
  mia.y = state==='finale' ? 0 : Math.min(h.y, onGround(mia.x)?0:h.y);
}

    collected.push(it.word); addWord(it.word); updHearts(); bump($('heartChip'));
    burst(it.x,it.y,'#ff6f9f',16,true); floatText(it.x,it.y-26,it.word);
    AU.sfx('heart'); haptic('medium');

/* ---------- Логика ---------- */
function updatePlay(dt){
  updatePlayer(dt);
  for (const it of L.items){
    if (it.taken) continue;
    const r = it.type==='rose'?22:30, dx=it.x-P.x, dy=it.y-(P.y-30);
    if (dx*dx+dy*dy<r*r){ collect(it); if (state!=='play') return; }
  }
  if (!L.final){
    if (!L.gateOpen && !P.stop && P.x>=L.gateX-62 && P.ground){ P.stop=true; P.x=L.gateX-62; say('Ворота закрыты на сердечко 💗',2.6); setTimeout(openPuzzle,750); }
    if (L.gateOpen && P.x>L.gateX+70 && !leaving){ leaving=true; nextLevel(); }
  } else if (P.x>=L.ivanX-64 && P.ground){ startFinale(); }
  if (li===0 && !flags.hintOff && clock>9){ flags.hintOff=1; $('tapHint').classList.remove('show'); }
}

function updIris(dt){

function drawIris(){
  if (!iris) return;
  const k = iris.dir==='close' ? ease(Math.min(1,iris.t)) : iris.dir==='open' ? 1-ease(Math.min(1,iris.t)) : 1;

  const cy = (L && state!=='title') ? clamp(P.y+GY-40,60,H-60) : H/2;

let pz=null;
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function openPuzzle(){

  $('pzRu').textContent='«'+sp.ru+'»'; $('pzMsg').textContent=''; $('pzAnswer').classList.remove('win');
  $('pzPool').style.display=''; renderPz(); $('puzzle').classList.add('show');
}
function tileEl(t,inAns){
  const b=document.createElement('button');
  b.className='tile'+(collected.includes(t.w)?' found':'')+(!inAns&&t.used?' used':'');
  b.dataset.id=t.id;
  b.innerHTML='<span class="en">'+t.w+'</span><span class="ru">'+(L.sp.hints[t.w]||'')+'</span>';
  b.onclick=()=>tapTile(t,inAns);
  return b;
}
function renderPz(){
  const A=$('pzAnswer'), Pp=$('pzPool'); A.innerHTML=''; Pp.innerHTML='';
  pz.answer.forEach(t=>A.appendChild(tileEl(t,true)));
  pz.tiles.forEach(t=>Pp.appendChild(tileEl(t,false)));
}
function tapTile(t,inAns){
  if (pz.done) return; AU.sfx('tile'); haptic('light');
  if (inAns){ pz.answer=pz.answer.filter(x=>x!==t); t.used=false; }
  else { if (t.used) return; t.used=true; pz.answer.push(t); }
  renderPz();
  if (pz.answer.length===L.sp.target.length) setTimeout(checkPz,300);
}
function checkPz(){
  if (pz.done || pz.answer.length!==L.sp.target.length) return;
  if (pz.answer.map(t=>t.w).join(' ')===L.sp.target.join(' ')) return winPz();
  pz.mist++; const card=$('pzCard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  AU.sfx('wrong'); haptic('error');
  $('pzMsg').textContent = pz.mist>=2 ? 'Нажми 💡 — Мия подскажет!' : 'Почти! Попробуй ещё разок 💕';
}
function hintPz(){
  if (!pz || pz.done) return;
  const tgt=L.sp.target; let k=0;
  while (k<pz.answer.length && pz.answer[k].w===tgt[k]) k++;
  pz.answer.slice(k).forEach(t=>t.used=false); pz.answer=pz.answer.slice(0,k); renderPz();
  if (k<tgt.length){ const t=pz.tiles.find(x=>!x.used && x.w===tgt[k]); const el=t && $('pzPool').querySelector('[data-id="'+t.id+'"]'); if (el) el.classList.add('glow'); $('pzMsg').textContent='Следующее слово мигает ✨'; }
  AU.sfx('tile');

function textPoints(lines,maxW,cy,lh){
  const oc=document.createElement('canvas'), ow=Math.ceil(W), oh=Math.ceil(H); oc.width=ow; oc.height=oh;
  const o=oc.getContext('2d'); let s=120;
  o.font='900 '+s+'px Nunito, sans-serif';
  const mw=Math.max(...lines.map(l=>o.measureText(l).width));
  s=Math.min(104, s*maxW/mw); o.font='900 '+s+'px Nunito, sans-serif';
  o.fillStyle='#fff'; o.textAlign='center'; o.textBaseline='middle';
  const total=(lines.length-1)*s*lh;
  lines.forEach((l,i)=>o.fillText(l, ow/2, cy-total/2+i*s*lh));
  const step=Math.max(3,Math.round(s/15)), d=o.getImageData(0,0,ow,oh).data, pts=[];
  for (let y=0;y<oh;y+=step) for (let x=0;x<ow;x+=step) if (d[(y*ow+x)*4+3]>140) pts.push({x:x+(Math.random()-.5)*1.4,y:y+(Math.random()-.5)*1.4});
  return pts;
}
function drawStarText(stars,t,fromOrigin){
  c.globalCompositeOperation='lighter';
  for (const s of stars){
    const k=clamp((t-s.d)/1.3,0,1); if (k<=0) continue;
    const e=ease(k); let x,y;
    if (fromOrigin){ const u=1-e; x=u*u*s.x0+2*u*e*s.cx+e*e*s.tx; y=u*u*s.y0+2*u*e*s.cy+e*e*s.ty; }
    else { x=lerp(s.x0,s.tx,e); y=lerp(s.y0,s.ty,e); }
    const a=.55+.45*Math.sin(T*3+s.ph);
    c.fillStyle=`rgba(255,${190+Math.floor(50*a)},${225},${a})`;
    c.fillRect(x-1.35,y-1.35,2.7,2.7);
    if (k<1) { c.fillStyle='rgba(255,180,220,.35)'; c.fillRect(x-2.5,y-2.5,5,5); }
  }
  c.globalCompositeOperation='source-over';
}

function typeLetter(){
  const box=$('lText'); box.innerHTML=''; const caret=document.createElement('span'); caret.className='caret';
  let pi=0, p=null, chars=null, ci=0;
  const step=()=>{
    if (letterSkip){ box.innerHTML=LETTER.map(t=>'<p>'+t+'</p>').join(''); finishLetter(); return; }
    if (!p){
      if (pi>=LETTER.length){ caret.remove(); finishLetter(); return; }
      p=document.createElement('p'); box.appendChild(p); p.appendChild(document.createTextNode('')); p.appendChild(caret);
      chars=Array.from(LETTER[pi]); ci=0;

    p.firstChild.textContent+=chars[ci++];
    if (ci%3===0) AU.sfx('type');
    if (ci>=chars.length){ p=null; pi++; typeTimer=setTimeout(step,520); }

}

const BG={church:bgChurch,beach:bgBeach,pizza:bgPizza,home:bgHome,final:bgFinal};

/* ---------- Земля, платформы, декор ---------- */
const GROUND={church:['#93d97e','#73c062','#8a6248','#5e4233'],beach:['#fff0bf','#f7d98e','#f0c46e','#cf9a4e'],pizza:['#e3ad84','#cf9068','#9a6750','#5f3e33'],home:['#80c074','#5f9f58','#5e4838','#352820'],final:['#456f5e','#33584a','#2b2840','#15132a']};
function drawGround(){
  const [t1,t2,b1,b2]=GROUND[L.theme];
  const g=c.createLinearGradient(0,GY,0,H); g.addColorStop(0,b1); g.addColorStop(1,b2);
  for (const [a,b] of L.segs){
    const x0=a-camX, x1=b-camX; if (x1<-20 || x0>W+20) continue;
    c.fillStyle=g; rr(x0,GY,x1-x0,H-GY+30,10); c.fill();
    c.fillStyle=t1; rr(x0,GY-3,x1-x0,15,7); c.fill();
    c.fillStyle=t2; c.beginPath(); for (let x=x0+8;x<x1-4;x+=14){ c.moveTo(x+5,GY+12); c.arc(x,GY+12,5,0,Math.PI); } c.fill();
    if (L.theme==='pizza'){ c.fillStyle='rgba(255,220,190,.18)'; for (let x=Math.ceil((a)/26)*26; x<b; x+=26){ const sx=x-camX; if (sx<-30||sx>W+30) continue; rr(sx+2,GY+24,20,9,4); c.fill(); rr(sx+15,GY+40,20,9,4); c.fill(); } }
    if (L.theme==='beach'){ c.fillStyle='rgba(255,255,255,.25)'; for (let x=Math.ceil(a/17)*17; x<b; x+=17){ const sx=x-camX; if (sx<-10||sx>W+10) continue; c.fillRect(sx,GY+22+R(x)*30,2,2); } }
  }
}
function drawPlat(p){
  const x=p.x-camX, y=p.y+GY, w=p.w; if (x>W+40 || x+w<-40) return;
  if (p.style==='cloud'){ for (let k=0;k<=w;k+=18) disc(x+k,y+10,12,'#e3e9ff'); for (let k=0;k<=w;k+=18) disc(x+k,y+6,12,'#fff'); }
  else if (p.style==='boat'){ const b=Math.sin(T*2)*1.5;
    c.fillStyle='#fff'; c.beginPath(); c.moveTo(x-8,y+b); c.lineTo(x+w+12,y+b); c.lineTo(x+w-2,y+22+b); c.lineTo(x+6,y+22+b); c.closePath(); c.fill();
    c.fillStyle='#e8475f'; c.fillRect(x-4,y+7+b,w+12,3); c.fillStyle='#1fa3d6'; c.fillRect(x+2,y+14+b,w,2);
    c.strokeStyle='rgba(255,255,255,.6)'; c.lineWidth=1.5; c.beginPath(); c.moveTo(x-14,y+24); c.lineTo(x+w+18,y+24); c.stroke(); }
  else if (p.style==='awning'){ c.strokeStyle='#5a3a4a'; c.lineWidth=3; c.beginPath(); c.moveTo(x+8,y); c.lineTo(x+8,GY); c.moveTo(x+w-8,y); c.lineTo(x+w-8,GY); c.stroke();
    for (let s=0;s<w;s+=13){ c.fillStyle=(s/13)%2?'#fff':'#e8475f'; c.fillRect(x+s,y,Math.min(13,w-s),12); c.beginPath(); c.arc(x+s+6.5,y+12,6.5,0,Math.PI); c.fill(); } }
  else { c.strokeStyle='#7b5236'; c.lineWidth=3; c.beginPath(); c.moveTo(x+14,y+8); c.lineTo(x+4,y+30); c.moveTo(x+w-14,y+8); c.lineTo(x+w-4,y+30); c.stroke();
    c.fillStyle='#c58f62'; rr(x,y,w,10,4); c.fill(); c.strokeStyle='rgba(90,50,30,.4)'; c.lineWidth=1; for (let s=24;s<w;s+=24){ c.beginPath(); c.moveTo(x+s,y+1); c.lineTo(x+s,y+9); c.stroke(); } }
}
function drawDecor(){
  for (const d of L.decor){
    const x=d.x-camX; if (x<-60||x>W+60) continue; const r=d.r;
    switch(d.kind){
      case 'flower': { const h=8+r*10, sw=Math.sin(T*2+d.x)*1.5; limb(x,GY,x+sw,GY-h,1.5,'#4f9a4a'); flower(x+sw,GY-h,3.4,['#ff8fb8','#ffd36e','#ffffff','#c79bff'][Math.floor(r*40)%4],'#ffcf5a'); break; }
      case 'bush': disc(x,GY-6,11,'#6cc160'); disc(x+10,GY-4,9,'#5fb455'); disc(x-9,GY-3,8,'#7ccc6c'); break;
      case 'shell': c.fillStyle='#ffc9d6'; c.beginPath(); c.moveTo(x,GY+6); c.arc(x,GY+6,6,Math.PI,TAU); c.fill(); break;
      case 'starfish': { c.fillStyle='#ff9a6b'; c.beginPath(); for (let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr2=k%2?2.4:6; c.lineTo(x+Math.cos(a)*rr2,GY+7+Math.sin(a)*rr2); } c.closePath(); c.fill(); break; }
      case 'umbrella': { limb(x,GY,x,GY-62,2.5,'#fff'); c.fillStyle='#ff7aa8'; c.fillRect(x-24,GY-3,48,5);
        for (let k=0;k<6;k++){ c.fillStyle=k%2?'#fff':'#ff5a7a'; c.beginPath(); c.moveTo(x,GY-62); c.arc(x,GY-62,32,Math.PI+k*Math.PI/6,Math.PI+(k+1)*Math.PI/6); c.closePath(); c.fill(); } break; }
      case 'lamp': { limb(x,GY,x,GY-92,3,'#3b2c4a'); c.fillStyle='#3b2c4a'; c.fillRect(x-6,GY-96,12,4); glow(x,GY-88,40,'255,214,140',.55); disc(x,GY-88,5,'#ffe7b0'); break; }
      case 'table': { limb(x,GY,x,GY-18,3,'#5a3a4a'); ell(x,GY-19,17,4,0,'#fff'); disc(x-4,GY-23,6,'#ffcf6e'); disc(x-4,GY-23,4.5,'#f2744f'); disc(x-6,GY-24,1,'#ffe8a0'); disc(x-2,GY-22,1,'#ffe8a0'); c.fillStyle='#fff'; c.fillRect(x+6,GY-27,4,6); c.fillRect(x+11,GY-27,4,6); break; }
      case 'planter': { c.fillStyle='#8c5a46'; rr(x-12,GY-14,24,14,3); c.fill(); flower(x-6,GY-18,3,'#ff8fb8','#ffd36e'); flower(x+5,GY-19,3,'#fff','#ffd36e'); break; }
      case 'fence': { c.fillStyle='#e9dcc9'; for (let k=0;k<4;k++) { rr(x+k*13,GY-24,6,24,2); c.fill(); } c.fillRect(x-2,GY-18,46,3); c.fillRect(x-2,GY-9,46,3); break; }
      case 'lantern': { limb(x,GY,x,GY-70,2.5,'#1f1a33'); glow(x,GY-70,46,'255,200,120',.6+.1*Math.sin(T*4+x)); c.fillStyle='#ffcf7a'; rr(x-5,GY-78,10,13,3); c.fill(); break; }
      case 'rosebush': { disc(x,GY-6,10,'#2f6b46'); disc(x+9,GY-4,8,'#295f3f'); disc(x-8,GY-4,7,'#357a50'); disc(x-3,GY-11,2.6,'#e8274b'); disc(x+6,GY-8,2.6,'#ff4d6d'); disc(x-8,GY-6,2.2,'#e8274b'); break; }
    }
  }
}
function drawSpring(s){
  const x=s.x-camX; if (x<-30||x>W+30) return; const q=s.sq, h=14*(1-q*.6);
  limb(x,GY,x,GY-h,3,'#3f9c56');
  ell(x,GY-h,17,7*(1+q*.4),0,'#ff7aa8'); disc(x-7,GY-h-1,1.8,'#fff'); disc(x+3,GY-h-3,1.8,'#fff'); disc(x+9,GY-h,1.5,'#fff');
  const a=.4+.4*Math.sin(T*5); c.globalAlpha=a; tri(x-5,GY-h-14,x+5,GY-h-14,x,GY-h-21,'#fff'); c.globalAlpha=1;
}
function drawGate(){
  const x=L.gateX-camX; if (x<-140||x>W+140) return; const b=GY;
  if (L.gateOpen) glow(x,b-80,150,'255,215,235',.85*L.gateT);
  c.fillStyle='#fff'; rr(x-54,b-118,14,118,6); c.fill(); rr(x+40,b-118,14,118,6); c.fill();
  c.strokeStyle='#fff'; c.lineWidth=12; c.beginPath(); c.arc(x,b-116,47,Math.PI,TAU); c.stroke();
  const cols=['#ff8fb8','#ffd36e','#c79bff','#ff5a7a'];
  for (let k=0;k<=12;k++){ const a=Math.PI+k/12*Math.PI; flower(x+Math.cos(a)*47,b-116+Math.sin(a)*47,5.5,cols[k%4],'#fff6c8'); }
  for (let k=0;k<5;k++){ flower(x-47,b-104+k*22,4.5,cols[(k+1)%4],'#fff6c8'); flower(x+47,b-96+k*22,4.5,cols[(k+2)%4],'#fff6c8'); }
  c.font='28px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(L.sp.sign,x,b-182);
  if (!L.gateOpen){
    const sw=Math.sin(T*2)*.12; c.save(); c.translate(x,b-162); c.rotate(sw);
    c.strokeStyle='#ffd36e'; c.lineWidth=2; c.beginPath(); c.moveTo(0,0); c.lineTo(0,62); c.stroke();
    glow(0,72,26,'255,120,170',.5); heart(0,72,26,'#ff4f88'); disc(0,70,3,'#8a1a45'); c.fillStyle='#8a1a45'; c.fillRect(-1.2,70,2.4,7);
    c.restore();
  }
}
function drawItems(){
  for (const it of L.items){
    if (it.taken) continue; const x=it.x-camX, y=it.y+GY; if (x<-40||x>W+40) continue;
    if (it.type==='heart'){
      const b=Math.sin(T*3+it.ph)*4, s=24*(1+Math.sin(T*6+it.ph)*.05);
      glow(x,y+b,36,'255,110,160',.45);
      const g=c.createLinearGradient(0,y+b-12,0,y+b+12); g.addColorStop(0,'#ffa3c4'); g.addColorStop(1,'#ff3f7f');
      c.fillStyle=g; heartPath(x,y+b,s); c.fill();
      ell(x-5,y+b-5,3,2,-.6,'rgba(255,255,255,.75)');
      c.font='900 11px Nunito, sans-serif'; c.textAlign='center'; c.textBaseline='middle';
      const w=c.measureText(it.word).width+12; c.fillStyle='rgba(255,255,255,.93)'; rr(x-w/2,y+b+12,w,16,8); c.fill();
      c.fillStyle='#c2386f'; c.fillText(it.word,x,y+b+20.5);
    } else if (it.type==='rose'){
      const yy=y+Math.sin(T*3+it.x)*3;
      limb(x,yy+4,x,yy+13,2,'#3f9c56'); ell(x+3.5,yy+9,3.5,1.8,-.5,'#4fb366');
      glow(x,yy,16,'255,80,110',.35);
      disc(x,yy,6.5,'#e8274b'); disc(x-1.5,yy-1.5,3.5,'#ff5a78');
      c.strokeStyle='#a3122f'; c.lineWidth=1; c.beginPath(); c.arc(x,yy,3.2,.5,4.5); c.stroke();
    } else {
      const p=(T*1.2+it.x)%1;
      glow(x,y,44,'255,215,120',.6);
      c.strokeStyle=`rgba(255,201,77,${1-p})`; c.lineWidth=2; c.beginPath(); c.arc(x,y,16+p*16,0,TAU); c.stroke();
      disc(x,y,16,'#fff7df'); c.strokeStyle='#ffc94d'; c.lineWidth=2.5; c.beginPath(); c.arc(x,y,16,0,TAU); c.stroke();
      c.font='18px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(it.emoji,x,y+1);
    }
  }
}
function supportY(x,y){
  let best=null;
  for (const p of L.plats) if (x>p.x-6 && x<p.x+p.w+6 && p.y>=y-1 && (best===null||p.y<best)) best=p.y;
  if (onGround(x) && 0>=y-1 && (best===null||0<best)) best=0;
  return best;
}
function shadow(x,y){
  const s=supportY(x,y); if (s===null) return;
  const k=clamp(1-(s-y)/220,.25,1); ell(x-camX,s+GY+1,13*k,3.2*k,0,`rgba(0,0,0,${.22*k})`);
}

/* ---------- Цикл ---------- */
function positionBubble(){
  if (!bubble.classList.contains('show') || !L) return;
  /* реплики закреплены вверху экрана */
}
function render(dt){
  c.setTransform(S*DPR,0,0,S*DPR,0,0);
  if (!L){ drawTitle(dt); for (const p of sparts) drawPart(p,0,0); drawIris(); return; }
  BG[L.theme]();
  drawGround(); L.plats.forEach(drawPlat); drawDecor(); if (!L.final) drawGate(); L.springs.forEach(drawSpring); drawItems();
  if (L.final){ shadow(L.ivanX,0); drawIvan(L.ivanX-camX,GY,{t:T,face:-1,hug:ivan.hug,bouquet:ivan.bouquet,happy:ivan.hug}); }
  shadow(mia.x,mia.y); shadow(P.x,P.y);
  drawMia(mia.x-camX,mia.y+GY,{t:T,moving:mia.moving && state!=='finale',face:1,happy:state==='finale'||state==='letter'});
  drawGirl(P.x-camX,P.y+GY,{t:P.t,face:1,run:(!P.stop||P.walk),air:!P.ground&&!P.rescue,vy:P.vy,sq:P.sq,hug:P.hug,bouquet:P.bouquet,happy:P.hug||state==='letter',lean:P.hug?.12:0});
  if (P.rescue){ cloudShape(P.x-camX-24,P.y+GY+8,40,'rgba(255,255,255,.95)'); }
  for (const p of parts) drawPart(p,camX,GY);
  if (skyStars){ skyStars.t+=dt; drawStarText(skyStars,skyStars.t,!skyStars.lerp); }
  drawBaby();
  for (const p of sparts) drawPart(p,0,0);
  positionBubble();
  drawIris();
}
function update(dt){
  if (state==='play'||state==='finale'){ clock+=dt; if (state==='play') updatePlay(dt); else updateFinale(dt); updateMia(dt); }
  if (state==='chapter'){ chapterT+=dt; if (chapterT>3.2) closeChapter(); }
  if (state==='letter' && Math.random()<dt*.9) launchFirework();
  updParts(parts,dt); updParts(sparts,dt); updIris(dt); updBubble(dt);
  if (L){
    for (const s of L.springs) s.sq*=Math.pow(.01,dt);
    if (L.gateOpen) L.gateT=Math.min(1,L.gateT+dt*1.5);
    let tx=P.x-W*.3;
    if (L.final && (state==='finale'||state==='letter')) tx=L.ivanX-W*.56;
    camX += (tx-camX)*Math.min(1,dt*5);
  }
}
function loop(ts){
  const now=ts/1000, dt=Math.min(.033, last?now-last:.016); last=now; T+=dt;
  update(dt); render(dt);
  requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); tapJump(); });
addEventListener('keydown',e=>{ if (e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); tapJump(); } });

resize(); updRoses();
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]) : Promise.resolve();
fontsReady.then(()=>{ if (state==='title') buildTitleStars(); });
requestAnimationFrame(loop);
</script>
